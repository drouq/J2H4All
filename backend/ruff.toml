# Lint config for the J2H4All backend. Goal: catch unused imports / dead code / undefined
# names automatically (the 2026-07-19 audit found these by hand). Run: `ruff check .`
# Scoped to real problems (pyflakes F + syntax/logic E4/E7/E9) plus two mechanical
# hygiene rules: import sorting (I) and modernizations (UP). Deliberately NOT a
# whole-codebase restyler — no line-wrapping or quote normalisation, so a diff stays
# about the change rather than the formatter.
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# No ignores. The E702 carve-out existed for an `import time as _t; _t.sleep()`
# throttle idiom that import-sorting made pointless — the two call sites now use a
# normal module-level import.

[lint.per-file-ignores]
# Migrations are Alembic-generated; leave their imports alone (including their order,
# which matches the template rather than our convention).
"migrations/**" = ["E402", "F401", "I001"]
# Dev/diagnostic scripts kept as-is (hand-run, not prod): don't flag their cruft.
"scripts/**" = ["E402", "F401", "F841", "I001"]
"app/garmin/probe.py" = ["E402", "F401", "F841"]
"app/garmin/diag.py" = ["E402", "F401", "F841"]
"app/garmin/refresh_probe.py" = ["E402", "F401", "F841"]
"app/garmin/refresh_e2e.py" = ["E402", "F401", "F841"]
