# Lint config for the J2H4All backend. Goal: catch unused imports / dead code / undefined
# names automatically (the 2026-07-19 audit found these by hand). Run: `ruff check .`
# Scoped to real problems (pyflakes F + syntax/logic E4/E7/E9), NOT whole-codebase
# restyling — import-sorting (I) and modernizations (UP) are deliberately left off to
# avoid churn; enable later if wanted.
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]
# `import time as _t; _t.sleep()` throttle idiom is intentional; keep the rest of E7
# (== None, bare except, etc.).
ignore = ["E702"]

[lint.per-file-ignores]
# Migrations are Alembic-generated; leave their imports alone.
"migrations/**" = ["E402", "F401"]
# Dev/diagnostic scripts kept as-is (hand-run, not prod): don't flag their cruft.
"scripts/**" = ["E402", "F401", "F841"]
"app/garmin/probe.py" = ["E402", "F401", "F841"]
"app/garmin/diag.py" = ["E402", "F401", "F841"]
"app/garmin/refresh_probe.py" = ["E402", "F401", "F841"]
"app/garmin/refresh_e2e.py" = ["E402", "F401", "F841"]
